name: Publish to npm registry
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Create snapshot release"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "packages/components/package.json"
      - "packages/theme/package.json"
      - "packages/components/src/**"
      - "packages/theme/src/**"
      - "packages/token-gen/package.json"
      - "packages/token-gen/**"
jobs:
  snapshot:
    name: Snapshot Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.snapshot == 'true' }}
    permissions:
      contents: read # For changeset to create a release
      pull-requests: write # For changeset to generate changelog and create a PR
      id-token: write # Required for OIDC publishing
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build packages
        run: pnpm build --filter="./packages/*"
      - name: Publish dev snapshot
        run: |
          pnpm changeset version --snapshot snapshot
          pnpm changeset publish --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Publish dev snapshot to GitHub Packages
        run: |
          for path in packages/*/; do
            path="${path%/}"
            name=$(node -p "require('./$path/package.json').name")
            version=$(node -p "require('./$path/package.json').version")
            if npm view "$name@$version" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "$name@$version already published to GitHub Packages, skipping"
            else
              pnpm --filter "$name" publish --tag snapshot --no-git-checks
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.snapshot != 'true' }}
    permissions:
      contents: write # For changeset to create a release
      pull-requests: write # For changeset to generate changelog and create a PR
      id-token: write # Required for OIDC publishing
      packages: write
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build --filter="./packages/*"

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: opengovsg/changesets-action@f68bb4b781c954856eabd2643d4087c8faa97f2a
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use OIDC for npm authentication instead of NPM_TOKEN
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        run: |
          for path in packages/*/; do
            path="${path%/}"
            name=$(node -p "require('./$path/package.json').name")
            version=$(node -p "require('./$path/package.json').version")
            if npm view "$name@$version" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "$name@$version already published to GitHub Packages, skipping"
            else
              pnpm --filter "$name" publish --no-git-checks
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
