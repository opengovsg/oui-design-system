name: "Chromatic (PR)"

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  changed-files:
    runs-on: ubuntu-latest
    name: changed-files
    outputs:
      all_changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            packages/components/src/**
            packages/theme/src/**
            apps/storybook/.storybook/**
  chromatic:
    name: Run Chromatic
    needs: changed-files
    runs-on: ubuntu-latest
    if: ${{ needs.changed-files.outputs.any_changed == 'true' }}
    outputs:
      storybookUrl: ${{ steps.chromatic.outputs.storybookUrl }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@latest
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          CHROMATIC_SLUG: ${{ github.repository }}
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          onlyChanged: true
          exitOnceUploaded: true
          autoAcceptChanges: main
          # Skip running Chromatic on dependabot and changeset PRs
          skip: "@(dependabot/**|changeset-release/**)"
  test:
    needs: chromatic
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium browser
        run: pnpx playwright install chromium --only-shell
      - name: Run tests
        run: pnpm test
        env:
          TARGET_URL: "${{ needs.chromatic.outputs.storybookUrl }}"
