name: CI

on:
  push:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium browser
        run: pnpx playwright install chromium --only-shell
      - name: Run Storybook tests
        run: pnpm test
