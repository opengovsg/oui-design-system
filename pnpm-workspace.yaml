packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  eslint: ^9.39.1
  prettier: ^3.5.3
  typescript: 5.7.3

catalogs:
  react-aria:
    react-aria-components: ^1.19.0
    react-aria: ^3.50.0
    react-stately: ^3.48.0
    "@react-aria/calendar": ^3.10.1
    "@react-aria/focus": ^3.22.1
    "@react-aria/i18n": ^3.13.1
    "@react-aria/interactions": ^3.28.1
    "@react-aria/utils": ^3.34.1
    "@react-stately/calendar": ^3.10.1
    "@react-stately/collections": ^3.13.1
    "@react-stately/form": ^3.3.1
    "@react-stately/list": ^3.14.1
    "@react-stately/utils": ^3.12.1
    "@react-types/shared": ^3.36.0
    "@internationalized/date": ^3.12.2
    "@internationalized/string": ^3.2.9
  react:
    "@types/react": ^19.2.17
    "@types/react-dom": ^19.2.3
    react: ^19.2.8
    react-dom: ^19.2.8
  storybook10:
    "@storybook/addon-a11y": 10.5.3
    "@storybook/addon-docs": 10.5.3
    "@storybook/addon-links": 10.5.3
    "@storybook/addon-themes": 10.5.3
    "@storybook/addon-vitest": 10.5.3
    "@storybook/nextjs": 10.5.3
    "@storybook/react-vite": 10.5.3
    eslint-plugin-storybook: 10.5.3
    storybook: 10.5.3
  tailwind:
    "@tailwindcss/postcss": 4.3.1
    "@tailwindcss/vite": 4.3.1
    tailwindcss: 4.3.1
  vitest:
    "@vitest/browser": 4.1.9
    "@vitest/browser-playwright": 4.1.9
    "@vitest/coverage-v8": 4.1.9
    vitest: 4.1.9

ignoredBuiltDependencies:
  - "@tailwindcss/oxide"

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - react
  - react-dom
  - next
  - "@next/env"
  - eslint-config-next
  - "@next/eslint-plugin-next"
  - storybook
  - "@storybook/*"
  - eslint-plugin-storybook

# mostly pnpm audit --fixes
overrides:
  "@eslint/plugin-kit@<0.3.4": ">=0.3.4"
  "@ungap/structured-clone@<1.3.1": ">=1.3.1"
  diff@<4.0.4: ">=4.0.4"
  expr-eval-fork@<=3.0.0: ">=3.0.1"
  lodash-es@>=4.0.0 <=4.17.22: ">=4.17.23"
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
  mdast-util-to-hast@>=13.0.0 <13.2.1: ">=13.2.1"
  on-headers@<1.1.0: ">=1.1.0"
  prettier: ^3.5.0
  qs@<6.14.1: ">=6.14.1"
  tar@<=7.5.2: ">=7.5.3"
  tar@<=7.5.3: ">=7.5.4"
  tmp@<=0.2.3: ">=0.2.4"
  vite@>=7.1.0 <=7.1.10: ">=7.1.11"
  vite@>=7.1.0 <=7.1.4: ">=7.1.5"
